name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Gio needs cgo on Linux and macOS for the windowing layer. On Windows the
    # pure-Go path is enough and avoids requiring a MinGW toolchain on the
    # runner, matching the release cross-build.
    env:
      CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packaging tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install Gio Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev \
            libegl1-mesa-dev libgles2-mesa-dev
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build client
        run: go build -trimpath -o bin/yourpm ./app
      - name: Build server
        run: go build -trimpath -o bin/yourpm-server ./cmd/yourpm-server
      - name: Windows CLI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o bin/yourpm-cli.exe ./app
          ./bin/yourpm-cli.exe version
          ./bin/yourpm-cli.exe workspaces --data-dir "$env:RUNNER_TEMP\yourpm-ci"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: yourpm-server:ci
