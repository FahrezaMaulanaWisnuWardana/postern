name: Desktop release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (MAJOR.MINOR.PATCH; builds artifacts, does not create a release)"
        required: true
      require_signing:
        description: "Fail Windows/macOS builds without signing credentials"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows
            arch: amd64
          - runner: macos-15
            target: darwin
            arch: arm64
          - runner: macos-15-intel
            target: darwin
            arch: amd64
          - runner: ubuntu-22.04
            target: linux
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CGO_ENABLED: ${{ matrix.target == 'windows' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from release import validate_version
          version = os.environ.get("INPUT_VERSION") or os.environ["GITHUB_REF_NAME"].removeprefix("v")
          validate_version(version)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"RELEASE_VERSION={version}\n")
          PY
      - name: Install Linux build and packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config dpkg-dev desktop-file-utils \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcursor-dev libxfixes-dev \
            libegl1-mesa-dev libgles2-mesa-dev
      - name: Prepare Linux packaging tools
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/appimagetool"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy/tool.AppImage"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool/tool.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy/tool.AppImage" "$RUNNER_TEMP/appimagetool/tool.AppImage"
          (cd "$RUNNER_TEMP/linuxdeploy" && ./tool.AppImage --appimage-extract)
          (cd "$RUNNER_TEMP/appimagetool" && ./tool.AppImage --appimage-extract)
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Prepare Windows packaging tools
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 is required on the Windows runner" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem "$sdk\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw "Windows SDK signtool was not found" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Packaging tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build distributions
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          args=(--version "$RELEASE_VERSION" --target "$TARGET" --arch "$ARCH")
          if [[ "$REQUIRE_SIGNING" == "true" && "$TARGET" != "linux" ]]; then
            args+=(--require-signing)
          fi
          if [[ "$TARGET" == "windows" ]]; then
            args+=(--iscc "$ISCC" --signtool "$SIGNTOOL")
          elif [[ "$TARGET" == "linux" ]]; then
            args+=(--linuxdeploy "$LINUXDEPLOY" --appimagetool "$APPIMAGETOOL")
          fi
          python scripts/release.py "${args[@]}"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        run: python3 scripts/checksums.py dist
      - name: Create draft release only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          tag, repo = os.environ["TAG"], os.environ["REPOSITORY"]
          # No automatic publication; never modify an existing public release.
          subprocess.run([
              "gh", "release", "create", tag, "--repo", repo, "--verify-tag",
              "--draft", "--generate-notes",
              "--notes", "Release candidate: inspect build-*.json for signing status. "
              "Complete docs/RELEASING.md checks before publishing. "
              "Unsigned builds are for internal testing only."
          ], check=True)
          subprocess.run([
              "gh", "release", "upload", tag, "--repo", repo,
              *[str(p) for p in sorted(pathlib.Path("dist").iterdir()) if p.is_file()]
          ], check=True)
          PY
